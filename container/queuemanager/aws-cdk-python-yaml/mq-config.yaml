# mq-config.yaml - IBM MQ on AWS ECS Fargate Configuration

queueManager:
  name: "QM1"
  image: "icr.io/ibm-messaging/mq:latest"
  cpu: 1024        # 1 vCPU (1024 CPU units)
  memoryLimit: 4096 # 4 GB RAM (4096 MiB)

# Security credentials can be configured below or injected securely at deployment time:
# cdk deploy -c app_password="YourAppPassword" -c admin_password="YourAdminPassword"
security:
  appPassword: ""
  adminPassword: ""

ports:
  messaging: 1414  # Raw TCP for MQ client applications
  console: 9443    # HTTPS for Web Console & REST Messaging API
