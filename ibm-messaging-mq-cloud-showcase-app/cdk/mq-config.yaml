# External configuration for the MQ on AWS CDK stack.
# Image registry/tags and resource allocations are defined here
# so they can be updated without touching the stack code.

mq:
  image: icr.io/ibm-messaging/mq:latest
  qmgrName: QM1
  cpu: 1024
  memoryMiB: 2048
  ports:
    mqi: 1414
    console: 9443

backend:
  image: null          # built from the local Dockerfile, set to an ECR URI to use a pre-built image
  cpu: 2048
  memoryMiB: 4096
  port: 8080

frontend:
  image: null          # built from the local Dockerfile, set to an ECR URI to use a pre-built image
  cpu: 1024
  memoryMiB: 2048
  port: 3000

task:
  cpu: 4096
  memoryMiB: 16384
  family: mqonaws

cluster:
  name: mqonaws

service:
  name: mqonaws-svc

efs:
  name: qm1data

secrets:
  appPasswordName: mqonaws/app-password
  adminPasswordName: mqonaws/admin-password

logs:
  groupName: /ecs/mqonaws
